[project]
name = "beekill95-github-io"
version = "0.1.0"
description = ""
authors = [{ name = "Bao Quan", email = "nguyenmbquan95@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.7.0,<4",
    "numpy>=1.24.2,<2",
    "pandas>=1.5.3",
    "seaborn>=0.12.2,<0.13",
    "numpyro>=0.11.0,<0.12",
    "doit>=0.36.0,<0.37",
]

[dependency-groups]
dev = [
    "jupyterlab>=3.6.1,<4",
    "jupytext>=1.14.4,<2",
    "nbconvert>=7.2.9,<8",
    "autopep8>=2.0.1,<3",
    "pylint>=2.16.2,<3",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
